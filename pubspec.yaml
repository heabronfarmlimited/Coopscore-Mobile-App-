name: heabron_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:

  cached_network_image: ^3.4.1
  change_case: ^2.2.0
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  file_picker: ^11.0.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  flutter_hooks: any
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  form_builder_validators: ^11.2.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  hive_flutter: ^1.1.0
  hooks_riverpod: ^3.2.1
  image_fade: ^0.6.2
  image_picker: ^1.2.1
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  loading_overlay: ^0.5.0
  logger: ^2.6.2

  path_provider: ^2.1.5
  pdf: ^3.12.0
  pin_code_fields: ^8.0.1
  pretty_dio_logger: ^1.4.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  stop_watch_timer: ^3.2.2
  timeago: ^3.7.1
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  uuid: ^4.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/nav/
    - assets/fonts/
    - assets/json/
    - assets/fonts/Manrope/
    - assets/fonts/Manrope/static/




  
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-VariableFont_wght.ttf
        - asset: assets/fonts/Manrope/static/Manrope-ExtraLight.ttf
        - asset: assets/fonts/Manrope/static/Manrope-Light.ttf
        - asset: assets/fonts/Manrope/static/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope/static/Manrope-Medium.ttf
        - asset: assets/fonts/Manrope/static/Manrope-SemiBold.ttf
        - asset: assets/fonts/Manrope/static/Manrope-Bold.ttf
        - asset: assets/fonts/Manrope/static/Manrope-ExtraBold.ttf
      